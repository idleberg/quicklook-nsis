[tools]
node = "24"
"cargo:clark-cli" = "0.3.0"
hk = "2.4.0"
pkl = "0.32.1"
rust = "1.96.0"
swiftlint = "0.63.2"
xcodegen = "2.46.0"

[settings]
# Node ships pnpm through corepack, pinned by packageManager in package.json
node.corepack = true

[env]
HK_MISE = 1
COREPACK_ENABLE_DOWNLOAD_PROMPT = 0
_.path = ["{{config_root}}/node_modules/.bin"]

[hooks]
postinstall = """
  hk install --mise
  pnpm install --frozen-lockfile
"""

[tasks.init]
description = "Drop the vendored quicklook-kit and use it from npm"
run = '''
#!/usr/bin/env bash
set -euo pipefail

if [ ! -d packages ]; then
  echo "Already initialised." >&2
  exit 1
fi

clark intro "quicklook-kit"
# clark confirm exits 1 for no; anything else non-zero means cancelled
status=0
clark confirm "Delete packages/ and use quicklook-kit from npm?" --initial-value false || status=$?
if [ "$status" -ne 0 ]; then
  clark cancel "Nothing changed."
  [ "$status" -eq 1 ] && exit 0 || exit "$status"
fi

version=$(node -p 'require("./packages/quicklook-kit/package.json").version')
rm -rf packages
sed -i.bak -e '/^packages:/d' -e '/^  - packages\//d' -e '/^linkWorkspacePackages:/d' pnpm-workspace.yaml
rm -f pnpm-workspace.yaml.bak
npm pkg set "devDependencies.quicklook-kit=^$version"

# The lockfile still points at the workspace copy
rm -f pnpm-lock.yaml
clark spinner "Installing dependencies" -- pnpm install

clark outro "Done. quicklook-kit $version now comes from npm."
'''

[tasks.dev]
description = "Start the dev server, drop a file on the page to preview it"
run = "pnpm exec quicklook dev"

[tasks.'build:web']
description = "Build the preview page only"
run = "pnpm exec quicklook build:web"

[tasks.build]
description = "Build the app with its Quick Look extension into .quicklook/build"
run = "pnpm exec quicklook build"

[tasks.register]
description = "Build the app, install it to /Applications and register the extension"
depends = ["build"]
run = "pnpm exec quicklook register"

[tasks.unregister]
description = "Remove the app from /Applications"
run = "pnpm exec quicklook unregister"

[tasks.check]
description = "Typecheck the preview, the package and the Swift sources"
depends = ["check:*"]

[tasks.'check:web']
description = "Typecheck the preview and the package"
run = ["pnpm check", "[ ! -d packages ] || pnpm --filter './packages/*' check"]

[tasks.'check:swift']
description = "Typecheck the Swift sources"
run = '''
[ -d packages ] || exit 0
xcrun swiftc -typecheck -parse-as-library -swift-version 6 packages/quicklook-kit/native/App/*.swift
xcrun swiftc -typecheck -parse-as-library -swift-version 6 packages/quicklook-kit/native/Extension/*.swift
'''

[tasks.lint]
description = "Lint JS/TS/Svelte/Astro and Swift sources"
run = ["pnpm exec biome lint .", "[ ! -d packages ] || swiftlint lint --quiet"]

[tasks.format]
description = "Format all sources in place"
run = [
  "pnpm exec biome check --write .",
  "[ ! -d packages ] || swift format --recursive --in-place packages/quicklook-kit/native",
]

[tasks.'format:check']
description = "Fail if any source is unformatted"
run = [
  "pnpm exec biome format .",
  "[ ! -d packages ] || swift format lint --strict --recursive packages/quicklook-kit/native",
]
