name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      # Builds the macOS app, universal (arm64 + x86_64) by default, and the Windows plugin.
      - run: mise run build
        env:
          VERSION: ${{ github.ref_name }}

      # Quick-Look-NSIS-<tag>-macos.zip and Quick-Look-NSIS-<tag>-windows.qlplugin
      - name: Package
        run: |
          mkdir release
          cd .quicklook/build
          app=$(basename macos/*.app .app)
          (cd macos && zip -r -9 -y "$GITHUB_WORKSPACE/release/${app// /-}-$GITHUB_REF_NAME-macos.zip" "$app.app")
          cp windows/*.qlplugin "$GITHUB_WORKSPACE/release/${app// /-}-$GITHUB_REF_NAME-windows.qlplugin"
          cd "$GITHUB_WORKSPACE/release"
          shasum -a 256 * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
